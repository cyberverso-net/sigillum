[package]
name = "sigillum-testpki-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sigillum-testpki]
path = ".."

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tsa_input"
path = "fuzz_targets/tsa_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openssl_output"
path = "fuzz_targets/openssl_output.rs"
test = false
doc = false
bench = false

# The fuzz targets form their own workspace, built with the nightly toolchain.
[workspace]
members = ["."]
