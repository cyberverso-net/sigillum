[workspace]
resolver = "3"
members = [
    "crates/sigillum-pki",
    "crates/sigillum-cms",
    "crates/sigillum-cades",
    "crates/sigillum-pades",
    "crates/sigillum-jades",
    "crates/sigillum-ffi",
    "crates/sigillum-oracle",
    "crates/sigillum-bench",
    "crates/sigillum-testpki",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/cyberverso-net/sigillum"
authors = ["Paolo De Rosa"]
categories = ["cryptography", "authentication"]
keywords = ["eidas", "ades", "cades", "pades", "e-signature"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# ADR-0010: the RSA private-key types and functions listed in clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"

# RSA key generation in sigillum-testpki takes minutes without optimisation
# of the big-integer arithmetic. Optimising this one dependency keeps the
# test PKI tests fast in debug builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
