name: Dependabot configuration

on:
  push:
    branches: [main]
  pull_request:
  # This workflow reports a required check. The merge queue does not merge
  # a group until every required check is reported for it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lists:
    name: Dependabot group and ignore lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the check
        run: .github/scripts/test-check-dependabot-lists.sh
      - name: Check the group and ignore lists and the Maven entry
        run: .github/scripts/check-dependabot-lists.sh .github/dependabot.yml
