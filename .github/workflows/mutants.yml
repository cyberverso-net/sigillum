name: Mutation testing

# Runs every night on the critical modules of
# docs/development/quality-gates.md, which .cargo/mutants.toml lists, on
# main. A run on the diff of a pull request took more than 30 minutes on
# a representative pull request (#80), so it runs nightly instead.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The number of shards; the matrix below lists 0 to SHARDS - 1.
  SHARDS: 8

jobs:
  shard:
    name: Mutation testing (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      # Three jobs on the four processors of the runner: on the measured
      # pull request they took 1 h 44 min where one job took 2 h 44 min.
      # Round-robin sharding spreads the slow files over the shards. The
      # exit code is kept for the report job, which judges it.
      - name: Test the mutants of the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          cargo mutants --no-shuffle --jobs 3 --shard "$SHARD/$SHARDS" --sharding round-robin || status=$?
          mkdir -p mutants.out
          echo "$status" > mutants.out/exit-status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  report:
    name: Mutation testing
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The threshold of docs/development/quality-gates.md, "Author gates".
      MUTATION_THRESHOLD: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the summary script
        run: .github/scripts/test-mutants-summary.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-out-shard-*
          path: ${{ runner.temp }}/shards
      # A shard that left no artefact has no exit-status, which the script
      # reports as a failure.
      - name: Report the score and the missed mutants
        run: |
          shards=()
          for ((k = 0; k < SHARDS; k++)); do
            shards+=("$RUNNER_TEMP/shards/mutants-out-shard-$k")
          done
          code=0
          .github/scripts/mutants-summary.sh "$MUTATION_THRESHOLD" "${shards[@]}" > "$RUNNER_TEMP/summary.md" || code=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/summary.md"
          exit "$code"
