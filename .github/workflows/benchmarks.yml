name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Name under which criterion saves the results
        type: string
        required: true
        default: ci

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check the baseline name
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          [[ "$BASELINE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::The baseline name may contain only letters, digits, dots, underscores and hyphens."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Run the benchmarks
        env:
          BASELINE: ${{ inputs.baseline }}
        run: cargo bench --locked -p sigillum-bench -- --save-baseline "$BASELINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ inputs.baseline }}-${{ github.run_number }}
          path: target/criterion
          if-no-files-found: error
          retention-days: 30
