# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Library crates use `rsa` for public-key operations only, enforced by
    # clippy.toml (ADR-0010). `sigillum-testpki` signs with test keys, to
    # which timing attacks do not apply.
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack on RSA private-key operations; accepted under ADR-0020" },
    # crypto-bigint 0.5, used by elliptic-curve 0.13 in the der 0.7
    # generation. The advisory reports secret-dependent branches in
    # operations intended to be constant time; the fix is in 0.7.6 only.
    # This entry now covers sigillum-testpki only, which signs with test
    # keys and stays on the der 0.7 generation (ADR-0025, rule 5). The
    # library crates are on the der 0.8 generation, with crypto-bigint 0.7.
    # Ignores apply to the whole workspace, so the CI check
    # .github/scripts/check-library-graph.sh fails if crypto-bigint 0.5
    # enters the dependency graph of a library crate.
    { id = "RUSTSEC-2026-0387", reason = "Timing variability in crypto-bigint 0.5; accepted for sigillum-testpki only, under ADR-0020 and ADR-0025" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list implements the licence policy of ADR-0003. It names the
# licences accepted so far as compatible with distributing sigillum under
# Apache-2.0 OR MIT; another compatible licence is added when a dependency
# needs it. Entries may be unused while the dependency set changes.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
