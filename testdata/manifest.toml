id = "mutations/pades-partial-byte-range"
path = "mutations/pades-partial-byte-range.pdf"
sha256 = "ca3943133e8c164eac5ed5157e6993f5f792cc6941fec66e577e715073af463c"
kind = "signed-document"
purpose = "PAdES signature signed/pades-b-b-p256, with a ByteRange that skips the signature dictionary and the rest of the signed revision after the Contents string, and covers a copy of the signed bytes appended to the file."
expected-openssl = "not-applicable"
expected-dss = { indication = "TOTAL-FAILED", sub-indication = "FORMAT_FAILURE" }
attack-class = "signature-wrapping"
links = { issuer = "pki/signer-p256", chain = ["pki/signer-p256", "pki/ca-ecdsa", "pki/root-ca"], revocation = ["ocsp/signer-p256", "crl/root-ca"] }
notes = "The second range of the ByteRange of the signature dictionary starts at the end of the source file, where a copy of the second signed range of the source is appended: the bytes that the ByteRange covers are those that were signed, and their SHA-256 digest is the value of the message-digest attribute. The ByteRange no longer covers the signature dictionary in use, nor the rest of the signed revision after the Contents string, and the digits of the value of the ByteRange are the only bytes changed in the file before the copy. The variant follows the signature wrapping attack of 1 Trillion Dollar Refund (ACM CCS 2019), threat D3 of the threat model. The bytes between the two ranges are no longer the Contents string of the signature dictionary in use, so the ByteRange no longer marks out the signed data of that dictionary, and the signature cannot be processed as its base format defines it: ISO 32000-1:2008, clause 12.8.1, Table 252, has the ByteRange describe the exact byte range for the digest calculation, which excludes the Contents entry, and recommends that it cover the entire file. ETSI EN 319 142-1 V1.2.1, clause 6.3, item k), requires the ByteRange to cover the entire file, including the Signature Dictionary but excluding the entry with key Contents, but that is a requirement of the baseline profile, and ETSI EN 319 102-1 V1.4.1, clause 5.2.2.1, NOTE, leaves conformance to a profile out of the format checking. The DSS result is therefore a prediction that rests on the reading of DSS for its base format: the format checking (clause 5.2.2) fails and the validation process for basic signatures returns FAILED with FORMAT_FAILURE (clause 5.3.4, step 1), reported as TOTAL-FAILED with FORMAT_FAILURE (clause 5.1.3, Table 6). DSS 6.5.1 gives this result in the validate-document mode of tools/dss-oracle under the aligned policy (ADR-0023), with the linked files only, with the errors BBB_FC_IBRV_ANS, the ByteRange is not consistent, and BBB_CV_IRDOI_ANS, the reference data object is not intact. DSS reads the bytes between the two ranges as the hexadecimal value of Contents; they differ from it here, so DSS marks the ByteRange not valid in its diagnostic data and validates the signature over an empty signed content instead, whose digest does not match the message-digest attribute: its diagnostic data gives that digest matcher as found but not intact, and the signature as not intact."
