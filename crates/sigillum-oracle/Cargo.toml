[package]
name = "sigillum-oracle"
description = "Differential test harness comparing sigillum with DSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "../../README.md"
publish = false

[features]
# Runs tools/dss-oracle with Java (ADR-0013). Off by default, so that the
# crate builds and its unit tests run without Java or Maven.
dss = []

[dependencies]
serde_json = "1.0.154"
# The manifest reader and the runner of tools/dss-oracle. sigillum-testpki
# depends on no sigillum crate, so this dependency cannot form a cycle.
sigillum-testpki = { path = "../sigillum-testpki", version = "0.0.0" }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["macros"] }

[lints]
workspace = true
