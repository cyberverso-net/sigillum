# Configuration of cargo mutants (https://mutants.rs/config-file.html).
#
# examine_globs lists the critical modules of
# docs/development/quality-gates.md, "Mutation testing": the code that
# signs, verifies or parses. The mutation-score threshold applies to them:
# .github/workflows/mutants.yml tests the mutants of the diff of each pull
# request that fall in them, and all of them every night.
#
# A -f or --file option on the command line adds to this list; it does not
# replace it. To test other files alone, add --no-config, which ignores
# this file.
#
# The other source files of the tool crates are not critical, for the
# reasons that quality-gates.md gives for each. Test modules, tests.rs,
# are test code. .github/scripts/check-mutants-globs.sh fails when a
# source file of these crates is neither selected below nor named here.
# not critical: crates/sigillum-testpki/src/lib.rs
# not critical: crates/sigillum-testpki/src/main.rs
# not critical: crates/sigillum-testpki/src/tsa_cli.rs
# not critical: crates/sigillum-testpki/src/verify_cli.rs
# not critical: crates/sigillum-testpki/src/documents.rs
# not critical: crates/sigillum-testpki/src/pki.rs
# not critical: crates/sigillum-testpki/src/pki/rng.rs
# not critical: crates/sigillum-oracle/src/lib.rs
# not critical: crates/sigillum-oracle/src/dss.rs
examine_globs = [
    # Library crates: all of their code.
    "crates/sigillum-pki/src/**/*.rs",
    "crates/sigillum-cms/src/**/*.rs",
    "crates/sigillum-cades/src/**/*.rs",
    "crates/sigillum-pades/src/**/*.rs",
    "crates/sigillum-jades/src/**/*.rs",
    # sigillum-testpki: issuance and signing of the test PKI, of the
    # timestamp tokens and of the signed corpus, the parsers of untrusted
    # input, and the OpenSSL and DSS checks of the corpus.
    "crates/sigillum-testpki/src/manifest.rs",
    "crates/sigillum-testpki/src/mutations.rs",
    "crates/sigillum-testpki/src/mutations/pades.rs",
    "crates/sigillum-testpki/src/signed.rs",
    "crates/sigillum-testpki/src/openssl.rs",
    "crates/sigillum-testpki/src/openssl/process.rs",
    "crates/sigillum-testpki/src/dss.rs",
    "crates/sigillum-testpki/src/timestamp.rs",
    "crates/sigillum-testpki/src/timestamp/input.rs",
    "crates/sigillum-testpki/src/pki/keys.rs",
    "crates/sigillum-testpki/src/pki/hierarchy.rs",
    "crates/sigillum-testpki/src/pki/issue.rs",
    "crates/sigillum-testpki/src/pki/crl.rs",
    "crates/sigillum-testpki/src/pki/ocsp.rs",
    # sigillum-oracle: the parser of summary.json, the comparison of
    # results and the validation runs. src/dss.rs is left out, as
    # quality-gates.md explains.
    "crates/sigillum-oracle/src/summary.rs",
    "crates/sigillum-oracle/src/compare.rs",
    "crates/sigillum-oracle/src/validation.rs",
]

# Equivalent mutants: each changes the code without changing what it
# computes, so no test can catch it. docs/development/quality-gates.md,
# "Mutation testing", gives the rule. Each pattern names the file, the
# operator and the function, and no line, so that it keeps matching when
# the file changes, and matches no mutant of the function that is not
# equivalent. That holds only while the function keeps its operators: the
# pull request that changes an excluded function checks its exclusion
# again.
exclude_re = [
    # (length << 8) | octet: the low eight bits of length << 8 are zero
    # and octet is below 256, so | and ^ give the same value (issue #164).
    '^crates/sigillum-testpki/src/openssl\.rs:\d+:\d+: replace \| with \^ in length_at$',
    '^crates/sigillum-testpki/src/timestamp/input\.rs:\d+:\d+: replace \| with \^ in check_value$',
    # (serial[0] & 0x3f) | 0x40: the mask clears bit 6, which 0x40 sets,
    # so | and ^ give the same octet (issue #164).
    '^crates/sigillum-testpki/src/timestamp\.rs:\d+:\d+: replace \| with \^ in serial_number$',
    # KeyCertSign | CRLSign and DigitalSignature | NonRepudiation: each
    # joins two distinct flags of the key usage bit string (RFC 5280,
    # section 4.2.1.3), whose bits differ, so | and ^ give the same set
    # (issue #164).
    '^crates/sigillum-testpki/src/pki/issue\.rs:\d+:\d+: replace \| with \^ in extensions$',
]
