name: Dependency audits

on:
  push:
    branches: [main]
  pull_request:
  # This workflow reports a required check. The merge queue does not merge
  # a group until every required check is reported for it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  vet:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-vet@0.10.3
          fallback: none
      - name: Check that every dependency is audited
        run: cargo vet --locked
