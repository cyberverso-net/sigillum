name: Mutation testing configuration

# Checks the configuration of mutants.yml when it, its scripts or the
# sources it selects change. Not a required check: it has a paths filter.
on:
  pull_request:
    paths:
      - .cargo/mutants.toml
      - .github/scripts/*mutants*
      - .github/workflows/mutants*.yml
      - crates/**

permissions:
  contents: read

jobs:
  config:
    name: Mutation testing configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the summary script
        run: .github/scripts/test-mutants-summary.sh
      - name: Test the glob check
        run: .github/scripts/test-check-mutants-globs.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Check that every critical-module glob matches a source file
        run: .github/scripts/check-mutants-globs.sh
