name: DSS oracle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: DSS oracle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/dss-oracle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tools/dss-oracle/pom.xml
      - name: Build and test
        run: mvn -B -ntp verify
      # The JAR contains DSS (LGPL-2.1) and is never uploaded as an artefact (ADR-0013).
      - name: Check the JAR
        run: |
          unzip -p target/dss-oracle.jar META-INF/MANIFEST.MF | grep -F "Multi-Release: true"
      # The tool is built with network access and run in a network namespace without it.
      - name: Run the executable without network
        run: |
          offline() {
            sudo unshare --net -- runuser -u "$(id -un)" -- env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$@"
          }
          offline true
          for url in https://github.com https://1.1.1.1; do
            if offline curl -sS --max-time 5 "$url" > /dev/null; then
              echo "The network namespace still reaches $url."
              exit 1
            fi
          done
          offline java -jar target/dss-oracle.jar --version | grep -F "(DSS "
          set +e
          offline java -jar target/dss-oracle.jar sign
          code=$?
          set -e
          test "$code" -eq 3
          out="$RUNNER_TEMP/validate-timestamp"
          offline java -Xmx512m -XX:+UseSerialGC -jar target/dss-oracle.jar validate-timestamp \
            --timestamp ../../testdata/timestamps/valid.tst \
            --data ../../testdata/timestamps/content.txt \
            --trust-anchor ../../testdata/pki/root-ca.pem \
            --certificate ../../testdata/pki/ca-ecdsa.pem \
            --crl ../../testdata/crl/ca-ecdsa.crl \
            --crl ../../testdata/crl/root-ca.crl \
            --validation-time 2030-01-15T10:00:00Z --timeout 120 \
            --out "$out"
          grep -F '"result": "validated"' "$out/summary.json"
          grep -F '"indication": "PASSED"' "$out/summary.json"
          out="$RUNNER_TEMP/validate-certificate"
          offline java -Xmx512m -XX:+UseSerialGC -jar target/dss-oracle.jar validate-certificate \
            --certificate ../../testdata/pki/signer-p256.pem \
            --certificate ../../testdata/pki/ca-ecdsa.pem \
            --trust-anchor ../../testdata/pki/root-ca.pem \
            --crl ../../testdata/crl/ca-ecdsa.crl \
            --crl ../../testdata/crl/root-ca.crl \
            --validation-time 2030-01-15T10:00:00Z --timeout 120 \
            --out "$out"
          grep -Fx '  "result": "validated",' "$out/summary.json"
          grep -Fx '  "indication": "PASSED",' "$out/summary.json"
          grep -Fx '      "status": "GOOD",' "$out/summary.json"
          grep -F '"file": "../../testdata/crl/ca-ecdsa.crl"' "$out/summary.json"
          out="$RUNNER_TEMP/validate-certificate-ocsp"
          offline java -Xmx512m -XX:+UseSerialGC -jar target/dss-oracle.jar validate-certificate \
            --certificate ../../testdata/pki/signer-p256.pem \
            --certificate ../../testdata/pki/ca-ecdsa.pem \
            --trust-anchor ../../testdata/pki/root-ca.pem \
            --ocsp ../../testdata/ocsp/signer-p256.der \
            --crl ../../testdata/crl/root-ca.crl \
            --validation-time 2030-01-15T10:00:00Z --timeout 120 \
            --out "$out"
          grep -Fx '  "result": "validated",' "$out/summary.json"
          grep -Fx '  "indication": "PASSED",' "$out/summary.json"
          grep -Fx '      "status": "GOOD",' "$out/summary.json"
          grep -F '"file": "../../testdata/ocsp/signer-p256.der"' "$out/summary.json"
          # The tests write one signed document per format to target/test-documents.
          for document in signed.p7m signed.pdf signed.jws detached.p7s; do
            out="$RUNNER_TEMP/validate-document-$document"
            detached=()
            if [ "$document" = detached.p7s ]; then
              detached=(--detached target/test-documents/content.txt)
            fi
            offline java -Xmx512m -XX:+UseSerialGC -jar target/dss-oracle.jar validate-document \
              --document "target/test-documents/$document" "${detached[@]}" \
              --trust-anchor ../../testdata/pki/root-ca.pem \
              --certificate ../../testdata/pki/ca-ecdsa.pem \
              --crl ../../testdata/crl/ca-ecdsa.crl \
              --crl ../../testdata/crl/root-ca.crl \
              --validation-time 2030-01-15T10:00:00Z --timeout 120 \
              --out "$out"
            grep -Fx '  "result": "validated",' "$out/summary.json"
            grep -Fx '  "indication": "TOTAL_PASSED",' "$out/summary.json"
            grep -F '"pdf-backend": "dss-pades-pdfbox"' "$out/summary.json"
          done
