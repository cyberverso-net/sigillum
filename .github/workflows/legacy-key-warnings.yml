name: Legacy key warnings

on:
  push:
    branches: [story/156-rsa-3072-fixtures]

permissions:
  contents: read

jobs:
  warnings:
    name: DSS warnings of the legacy-key-size documents
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tools/dss-oracle/pom.xml
      - name: Build tools/dss-oracle
        working-directory: tools/dss-oracle
        run: mvn -B -ntp package -DskipTests
      - name: Validate each document with its linked files
        shell: python3 {0}
        run: |
          import json, os, subprocess, tomllib
          root = "testdata"
          with open(f"{root}/manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          time = manifest["header"]["validation-time"]
          by_id = {a["id"]: a for a in manifest["artefact"]}
          ids = sorted(i for i in by_id if i.startswith("signed/") and i.endswith("-rsa"))
          ids += ["signed/cades-enveloping-b-lt-rsa-pss", "signed/pades-b-t-p256", "signed/jades-general-b-b-ed25519"]
          tmp = os.environ["RUNNER_TEMP"]
          for n, doc_id in enumerate(ids):
              doc = by_id[doc_id]
              links = doc.get("links", {})
              path = lambda i: f"{root}/{by_id[i]['path']}"
              chain = links.get("chain", [])
              anchor = chain[-1]
              args = ["java", "-jar", "tools/dss-oracle/target/dss-oracle.jar", "validate-document",
                      "--document", f"{root}/{doc['path']}"]
              if "content" in links:
                  args += ["--detached", path(links["content"])]
              seen = []
              for c in chain + links.get("timestamp-chain", []):
                  if c != anchor and c not in seen:
                      seen.append(c)
                      args += ["--certificate", path(c)]
              args += ["--trust-anchor", path(anchor)]
              for r in dict.fromkeys(links.get("revocation", [])):
                  args += ["--crl" if by_id[r]["kind"] == "crl" else "--ocsp", path(r)]
              out = f"{tmp}/doc-{n}"
              args += ["--validation-time", time, "--out", out]
              subprocess.run(args, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              with open(f"{out}/summary.json") as f:
                  summary = json.load(f)
              for s in summary["details"]["signatures"]:
                  warnings = [w["key"] for w in s["warnings"]]
                  print(f"| {doc_id} | {s['indication']} | {s['sub-indication']} | {', '.join(warnings) or 'none'} |")
                  for w in s["warnings"]:
                      print(f"|   | {w['key']} | {w['message']} |")
