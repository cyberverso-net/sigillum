links = { issuer = "pki/ocsp-responder", chain = ["pki/ocsp-responder", "pki/ca-ecdsa", "pki/root-ca"] }
notes = "Covered certificate: pki/signer-p256. A fixture for threat K10 of the threat model. The issuer key hash of the CertID is that of pki/ca-ecdsa with its last octet inverted; the other fields are those of ocsp/signer-p256. RFC 6960, sections 3.2 and 4.1.1: the CertID does not identify the certificate, so the response does not apply to it, and openssl ocsp finds no status for it. OpenSSL also fails to verify the response, because pki/ocsp-responder is not a delegated responder of the CA that the CertID names (RFC 6960, section 4.2.2.2); a test of sigillum should assert the first reason, that the response does not apply to the certificate. The DSS result is a prediction: without a response that applies to the certificate, the path validation cannot show that it is not revoked (RFC 5280, section 6.1.3, step (a)(3)), and step 4 e) of ETSI EN 319 102-1 V1.4.1, clause 5.2.6.4, applies. DSS is likely to report TRY_LATER instead, from its check for acceptable revocation data."
