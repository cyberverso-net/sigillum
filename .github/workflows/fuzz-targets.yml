name: Fuzz targets

on:
  push:
    branches: [main]
  pull_request:
  # This workflow reports a required check. The merge queue does not merge
  # a group until every required check is reported for it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # The listing of the targets and the minimisation of the nightly fuzzing.
      - name: Test the scripts of the nightly fuzzing
        run: |
          .github/scripts/test-fuzz-targets.sh
          .github/scripts/test-fuzz-minimise.sh
      - name: Check the fuzz targets of sigillum-testpki
        run: cargo check --locked --manifest-path crates/sigillum-testpki/fuzz/Cargo.toml
      - name: Check the fuzz targets of sigillum-oracle
        run: cargo check --locked --manifest-path crates/sigillum-oracle/fuzz/Cargo.toml
